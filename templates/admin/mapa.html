{% extends "admin/base_admin.html" %}

{% block title %}Mapa de Sedes y Rutas{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold text-dark mb-1">
                <i class="bi bi-map-fill text-warning me-2"></i>Monitoreo de Sedes & Cobertura Vial
            </h4>
            <p class="text-muted small mb-0">Visualización de agencias y red de rutas sobre la red vial de Google Maps.</p>
        </div>
        <div>
            <span class="badge bg-warning-subtle text-dark border border-warning px-3 py-2 fw-semibold">
                <i class="bi bi-google me-1"></i> Google Maps API
            </span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="card-body p-0">
            <div id="mapa" style="width: 100%; height: 600px;"></div>
        </div>
    </div>
</div>

<!-- Datos provenientes de Flask -->
<script>
    const sedes = {{ sedes | tojson }};
    const rutas = {{ rutas | tojson }};
</script>

<script>
    function iniciarMapa() {
        // Centro inicial (Pasco, Perú)
        const centro = { lat: -10.6672, lng: -76.2561 };

        const mapa = new google.maps.Map(document.getElementById("mapa"), {
            center: centro,
            zoom: 8,
            mapTypeId: google.maps.MapTypeId.ROADMAP, // Permite alternar a SATELLITE o HYBRID
            mapTypeControl: true,
            mapTypeControlOptions: {
                style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
                position: google.maps.ControlPosition.TOP_RIGHT
            }
        });

        const ventana = new google.maps.InfoWindow();
        const bounds = new google.maps.LatLngBounds();

        // 1. Dibujar Marcadores de las Sedes
        sedes.forEach(function(sede) {
            const pos = { 
                lat: Number(sede.latitud), 
                lng: Number(sede.longitud) 
            };

            bounds.extend(pos);

            const marcador = new google.maps.Marker({
                position: pos,
                map: mapa,
                title: sede.nombre_sede,
                icon: {
                    url: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
                }
            });

            marcador.addListener("click", function() {
                const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${pos.lat},${pos.lng}`;
                const contenidoHtml = `
                    <div style="padding: 8px; max-width: 230px; font-family: sans-serif;">
                        <span class="badge bg-dark text-warning fw-bold mb-1" style="font-size: 10px;">AGENCIA PASCO</span>
                        <h6 style="font-weight: bold; margin-bottom: 5px; color: #212529;">${sede.nombre_sede}</h6>
                        <p style="font-size: 12px; color: #6c757d; margin-bottom: 10px;">
                            <i class="bi bi-geo-alt-fill text-danger"></i> ${sede.direccion || "Dirección no registrada"}
                        </p>
                        <a href="${googleMapsUrl}" target="_blank" style="display: block; text-align: center; background: #212529; color: #fff; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold;">
                            Abrir GPS en Google Maps
                        </a>
                    </div>
                `;
                ventana.setContent(contenidoHtml);
                ventana.open(mapa, marcador);
            });
        });

        // Autoajustar el zoom para ver todas las sedes
        if (sedes.length > 0) {
            mapa.fitBounds(bounds);
        }

        // 2. Trazar Rutas por Carretera Real utilizando DirectionsService
        const directionsService = new google.maps.DirectionsService();

        rutas.forEach(function(ruta) {
            const origen = { lat: Number(ruta.latitud_origen), lng: Number(ruta.longitud_origen) };
            const destino = { lat: Number(ruta.latitud_destino), lng: Number(ruta.longitud_destino) };

            const directionsRenderer = new google.maps.DirectionsRenderer({
                map: mapa,
                suppressMarkers: true, // Evitamos marcadores por defecto (A y B) para usar nuestras sedes
                polylineOptions: {
                    strokeColor: "#ffc107",
                    strokeOpacity: 0.85,
                    strokeWeight: 6
                }
            });

            directionsService.route(
                {
                    origin: origen,
                    destination: destino,
                    travelMode: google.maps.TravelMode.DRIVING
                },
                function(result, status) {
                    if (status === google.maps.DirectionsStatus.OK) {
                        directionsRenderer.setDirections(result);
                    } else {
                        // Respaldo en línea recta si falla la consulta de ruteo
                        new google.maps.Polyline({
                            path: [origen, destino],
                            geodesic: true,
                            strokeColor: "#ffc107",
                            strokeOpacity: 0.8,
                            strokeWeight: 5,
                            map: mapa
                        });
                    }
                }
            );
        });
    }
</script>

<!-- Carga de la API de Google Maps -->
<script src="https://maps.googleapis.com/maps/api/js?key={{ google_maps_api_key }}&callback=iniciarMapa" async defer></script>
{% endblock %}
