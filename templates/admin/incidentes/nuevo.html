{% extends 'admin/base_admin.html' %}
{% block title %}Nuevo Incidente{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 700px;">
    <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
            <h5 class="fw-bold text-dark mb-3">
                <i class="bi bi-shield-exclamation text-warning me-2"></i>Registrar Incidente en Ruta
            </h5>

            <form method="POST">
                <!-- VIAJE AFECTADO -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">VIAJE AFECTADO <span class="text-danger">*</span></label>
                    <select name="id_viaje" class="form-select border-light-subtle" required>
                        <option value="">-- Seleccione el viaje afectado --</option>
                        {% for v in viajes %}
                            {% set vehiculo_nom = v.vehiculo_efectivo.placa if v.vehiculo_efectivo else 'Sin Bus' %}
                            <option value="{{ v.id_viaje }}">
                                Viaje #{{ v.id_viaje }} ({{ v.fecha_salida.strftime('%d/%m/%Y') }} {{ v.salida_programada.strftime('%H:%M') }} hrs) — 
                                {{ v.horario.ruta.origen.ciudad }} ➔ {{ v.horario.ruta.destino.ciudad }} [{{ vehiculo_nom }}]
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row">
                    <!-- TIPO DE INCIDENTE -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold text-muted">TIPO DE INCIDENTE <span class="text-danger">*</span></label>
                        <select name="tipo_incidente" class="form-select border-light-subtle" required>
                            <option value="falla_mecanica">Falla Mecánica</option>
                            <option value="bloqueo_via">Bloqueo de Vía / Protesta</option>
                            <option value="clima">Clima / Derrumbe</option>
                            <option value="accidente">Accidente de Tránsito</option>
                            <option value="retraso">Retraso Operativo</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>

                    <!-- RETRASO ESTIMADO -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label small fw-semibold text-muted">RETRASO ESTIMADO (MINUTOS)</label>
                        <input type="number" name="minutos_retraso_estimado" class="form-control border-light-subtle" value="0" min="0" step="5" required>
                    </div>
                </div>

                <!-- LUGAR REFERENCIAL -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">LUGAR REFERENCIAL <span class="text-danger">*</span></label>
                    <input type="text" name="lugar_referencial" class="form-control border-light-subtle" placeholder="Ej. Km 85 Carretera Central - Ticlio" required>
                </div>

                <!-- DESCRIPCIÓN -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">DESCRIPCIÓN DE LO SUCEDIDO <span class="text-danger">*</span></label>
                    <textarea name="descripcion" class="form-control border-light-subtle" rows="3" placeholder="Detalle las causas y acciones tomadas..." required></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                    <a href="{{ url_for('incidentes.listar_incidentes') }}" class="btn btn-light border btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-warning fw-bold text-dark px-4">
                        <i class="bi bi-check-lg me-1"></i> Guardar Incidente
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
