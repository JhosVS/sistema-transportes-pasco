{% extends "admin/base_admin.html" %}

{% block content %}
<h2>Registrar Nuevo Horario Recurrente</h2>

<form method="POST" class="mt-3">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Ruta:</label>
            <select name="id_ruta" class="form-select" required>
                <option value="">Seleccione...</option>
                {% for r in rutas %}
                    <option value="{{ r.id_ruta }}">{{ r.nombre_ruta }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3 mb-3">
            <label class="form-label">Día de la semana:</label>
            <select name="dia_semana" class="form-select" required>
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miercoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sabado">Sábado</option>
                <option value="Domingo">Domingo</option>
            </select>
        </div>

        <div class="col-md-3 mb-3">
            <label class="form-label">Hora de Salida:</label>
            <input type="time" name="hora_salida" class="form-control" required>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Vehículo:</label>
            <select name="id_vehiculo" class="form-select" required>
                <option value="">Seleccione...</option>
                {% for v in vehiculos %}
                    <option value="{{ v.id_vehiculo }}">{{ v.vehiculo }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6 mb-3">
            <label class="form-label">Conductor Encaragado:</label>
            <select name="id_conductor" class="form-select" required>
                <option value="">Seleccione...</option>
                {% for c in conductores %}
                    <option value="{{ c.id_conductor }}">{{ c.conductor }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Precio Pasaje Base (S/):</label>
            <input type="number" step="0.50" name="precio_pasaje_base" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Precio Kg Encomienda (S/):</label>
            <input type="number" step="0.10" name="precio_kg_carga_base" class="form-control" required>
        </div>
    </div>

    <button type="submit" class="btn btn-success">Guardar Horario</button>
    <a href="{{ url_for('admin_viajes.index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
