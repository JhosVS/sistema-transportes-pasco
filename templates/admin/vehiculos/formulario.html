{% extends 'admin/base_admin.html' %}

{% set es_edicion = vehiculo is defined and vehiculo %}

{% block title %}
{{ 'Editar' if es_edicion else 'Nuevo' }} Vehículo
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">
        <i class="bi bi-bus-front"></i>
        {{ 'Editar Vehículo' if es_edicion else 'Nuevo Vehículo' }}
    </h4>

    <a href="{{ url_for('vehiculos.index') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<form method="POST"
    action="{{ url_for('vehiculos.editar', id_vehiculo=vehiculo.id_vehiculo) if es_edicion else url_for('vehiculos.crear') }}">

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="row g-3">

                <!-- PLACA -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Placa</label>
                    <input type="text" name="placa" class="form-control"
                        value="{{ vehiculo.placa if es_edicion else '' }}" placeholder="Ej. C1A-750" required>
                </div>

                <!-- MARCA -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Marca</label>
                    <input type="text" name="marca" class="form-control"
                        value="{{ vehiculo.marca if es_edicion else '' }}" placeholder="Ej. Mercedes-Benz" required>
                </div>

                <!-- MODELO -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Modelo</label>
                    <input type="text" name="modelo" class="form-control"
                        value="{{ vehiculo.modelo if es_edicion else '' }}" placeholder="Ej. O-500R" required>
                </div>

                <!-- TIPO VEHÍCULO -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Tipo de Vehículo</label>
                    <select name="tipo" class="form-select" required>
                        {% set tipo_actual = vehiculo.tipo if es_edicion else 'bus' %}
                        <option value="bus" {% if tipo_actual == 'bus' %}selected{% endif %}>Bus</option>
                        <option value="minivan" {% if tipo_actual == 'minivan' %}selected{% endif %}>Minivan</option>
                        <option value="camion" {% if tipo_actual == 'camion' %}selected{% endif %}>Camión</option>
                    </select>
                </div>

                <!-- AÑO -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Año de Fabricación</label>
                    <input type="number" name="anio" class="form-control"
                        value="{{ vehiculo.anio if es_edicion and vehiculo.anio else '' }}" min="1990" max="2030" placeholder="Ej. 2020">
                </div>

                <!-- COLOR -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Color</label>
                    <input type="text" name="color" class="form-control"
                        value="{{ vehiculo.color if es_edicion and vehiculo.color else '' }}" placeholder="Ej. Azul/Blanco">
                </div>

                <!-- CAPACIDAD ASIENTOS -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Capacidad de asientos</label>
                    <input type="number" name="capacidad_asientos" class="form-control"
                        value="{{ vehiculo.capacidad_asientos if es_edicion else '' }}" min="1" placeholder="Ej. 44" required>
                </div>

                <!-- CAPACIDAD CARGA -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Capacidad de carga (kg)</label>
                    <input type="number" name="capacidad_carga_kg" class="form-control"
                        value="{{ vehiculo.capacidad_carga_kg if es_edicion else '' }}" min="0" step="0.01" placeholder="Ej. 1200.00" required>
                </div>

                <!-- KILOMETRAJE ACTUAL -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Kilometraje Actual (km)</label>
                    <input type="number" name="kilometraje_actual" class="form-control"
                        value="{{ vehiculo.kilometraje_actual if es_edicion else '0' }}" min="0" required>
                </div>

                <!-- ESTADO -->
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Estado</label>
                    <select name="estado" class="form-select">
                        {% set estado_actual = vehiculo.estado if es_edicion else 'Disponible' %}
                        <option value="Disponible" {% if estado_actual == 'Disponible' %}selected{% endif %}>
                            Disponible
                        </option>
                        <option value="Mantenimiento" {% if estado_actual == 'Mantenimiento' %}selected{% endif %}>
                            Mantenimiento
                        </option>
                        <option value="Baja" {% if estado_actual == 'Baja' %}selected{% endif %}>
                            Baja
                        </option>
                    </select>
                </div>

            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-warning text-white fw-bold">
                    <i class="bi bi-check-lg"></i>
                    {{ 'Actualizar' if es_edicion else 'Guardar Vehículo' }}
                </button>

                <a href="{{ url_for('vehiculos.index') }}" class="btn btn-light border">
                    Cancelar
                </a>
            </div>

        </div>
    </div>

</form>

{% endblock %}
