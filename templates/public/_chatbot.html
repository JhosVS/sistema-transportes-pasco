<style>
    #cbBtn { position: fixed; right: 20px; bottom: 20px; width: 58px; height: 58px; border-radius: 50%; border: 0;
             background: #ffc107; color: #000; font-size: 1.5rem; box-shadow: 0 4px 14px rgba(0,0,0,.3); z-index: 1050; }
    #cbPanel { position: fixed; right: 20px; bottom: 90px; width: 340px; max-width: calc(100vw - 40px); height: 440px;
               background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.3); z-index: 1050;
               display: none; flex-direction: column; overflow: hidden; }
    #cbPanel.abierto { display: flex; }
    #cbMsgs { flex: 1; overflow-y: auto; padding: 12px; background: #f8f9fa; font-size: .88rem; }
    .cbm { margin-bottom: 8px; padding: 8px 12px; border-radius: 12px; max-width: 85%; white-space: pre-wrap; }
    .cbm.bot { background: #fff; border: 1px solid #dee2e6; }
    .cbm.yo { background: #ffc107; margin-left: auto; }
    .cbm.err { background: #f8d7da; }
    @media print { #cbBtn, #cbPanel { display: none !important; } }
</style>

<button id="cbBtn" aria-label="Abrir asistente"><i class="bi bi-chat-dots-fill"></i></button>
<div id="cbPanel">
    <div class="bg-dark text-white px-3 py-2 d-flex justify-content-between align-items-center">
        <span class="fw-semibold"><i class="bi bi-bus-front text-warning me-1"></i>Asistente de viajes</span>
        <button id="cbCerrar" class="btn-close btn-close-white btn-sm" aria-label="Cerrar"></button>
    </div>
    <div id="cbMsgs">
        <div class="cbm bot">¡Hola! Te ayudo con horarios, precios y encomiendas.</div>
        <div class="d-flex flex-wrap gap-1 mb-2">
            <button class="btn btn-sm btn-outline-secondary cbSug">¿Cuánto cuesta ir de Tarma a Cerro de Pasco?</button>
            <button class="btn btn-sm btn-outline-secondary cbSug">¿Qué horarios hay a Lima?</button>
            <button class="btn btn-sm btn-outline-secondary cbSug">¿Cuánto cuesta enviar una encomienda a Huancayo?</button>
        </div>
    </div>
    <form id="cbForm" class="d-flex gap-2 p-2 border-top">
        <input id="cbQ" class="form-control form-control-sm" maxlength="200" placeholder="Escribe tu pregunta..." autocomplete="off" required>
        <button class="btn btn-dark btn-sm"><i class="bi bi-send text-warning"></i></button>
    </form>
</div>

<script>
(() => {
    const $ = id => document.getElementById(id), msgs = $('cbMsgs');
    $('cbBtn').onclick = () => $('cbPanel').classList.toggle('abierto');
    $('cbCerrar').onclick = () => $('cbPanel').classList.remove('abierto');
    function burbuja(t, c) {
        const d = document.createElement('div'); d.className = 'cbm ' + c; d.textContent = t;
        msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
    }
    async function enviar(t) {
        burbuja(t, 'yo'); $('cbQ').value = '';
        const espera = burbuja('Escribiendo...', 'bot');
        try {
            const r = await fetch("{{ url_for('chatbot.preguntar') }}", { method: 'POST',
                headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pregunta: t }) });
            const d = await r.json(); espera.remove();
            burbuja(d.error || d.respuesta, d.error ? 'err' : 'bot');
        } catch (e) { espera.remove(); burbuja('No hay conexión con el servidor.', 'err'); }
    }
    $('cbForm').onsubmit = e => { e.preventDefault(); const t = $('cbQ').value.trim(); if (t) enviar(t); };
    document.querySelectorAll('.cbSug').forEach(b => b.onclick = () => enviar(b.textContent));
})();
</script>
